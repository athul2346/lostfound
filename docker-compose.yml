services:
  db:
    image: postgres:16
    container_name: lostfound-db
    restart: always
    environment:
      POSTGRES_USER: lostfound
      POSTGRES_PASSWORD: lostfound
      POSTGRES_DB: lostfound
    ports:
      - "5432:5432"
    volumes:
      - lostfound_pgdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    container_name: lostfound-mail
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  lostfound_pgdata: